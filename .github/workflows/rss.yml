name: Check Reviews RSS

on:
  schedule:
    # 每 20 分钟自动运行一次 (Cron 语法)
    - cron: '*/20 * * * *'
  workflow_dispatch: # 允许在 GitHub 手动点按钮触发测试

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run RSS Script
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python main.py

      - name: Commit history back to repo
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add sent_history.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update sent history" && git push)
